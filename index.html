<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieMind | AI Movie Recommendations</title>

    <meta name="description"
        content="Find your next movie with AI-powered personalized recommendations.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <main class="container">

        <section class="hero">

            <div class="hero-badge">
                ✦ AI MOVIE RECOMMENDER
            </div>

            <h1>
                Find Your Next
                <span>Movie.</span>
            </h1>

            <p>
                Tell us what you love.
                We'll find movies that match your taste.
            </p>

        </section>


        <section class="recommendation-box">

            <h2>🎬 Your Movie Preferences</h2>


            <!-- GENRE -->

            <div class="form-section">

                <label for="genre">
                    What genre are you in the mood for?
                </label>

                <select id="genre">

                    <option value="any">Any</option>

                    <option value="science fiction">
                        Sci-Fi
                    </option>

                    <option value="thriller">
                        Thriller
                    </option>

                    <option value="action">
                        Action
                    </option>

                    <option value="drama">
                        Drama
                    </option>

                    <option value="comedy">
                        Comedy
                    </option>

                    <option value="horror">
                        Horror
                    </option>

                    <option value="romance">
                        Romance
                    </option>

                    <option value="mystery">
                        Mystery
                    </option>

                    <option value="adventure">
                        Adventure
                    </option>

                    <option value="fantasy">
                        Fantasy
                    </option>

                </select>

            </div>


            <!-- RELEASE PERIOD -->

            <div class="form-section">

                <label for="period">
                    What release period?
                </label>

                <select id="period">

                    <option value="any">
                        Any
                    </option>

                    <option value="2020-2027">
                        2020 – 2027
                    </option>

                    <option value="2010-2020">
                        2010 – 2020
                    </option>

                    <option value="2000-2010">
                        2000 – 2010
                    </option>

                    <option value="1990-2000">
                        1990 – 2000
                    </option>

                    <option value="1980-1990">
                        1980 – 1990
                    </option>

                    <option value="before-1980">
                        Before 1980
                    </option>

                </select>

            </div>


            <!-- PLOT TWIST -->

            <div class="form-section">

                <label for="plotTwist">
                    Do you want a plot twist?
                </label>

                <select id="plotTwist">

                    <option value="any">
                        Any
                    </option>

                    <option value="yes">
                        Yes — I want a plot twist
                    </option>

                    <option value="no">
                        No — keep it straightforward
                    </option>

                </select>

            </div>


            <!-- FAVOURITE MOVIES -->

            <div class="form-section">

                <label>
                    Name up to 3 movies you love
                </label>

                <p class="hint">
                    These help the AI understand your taste.
                </p>

                <input
                    type="text"
                    id="movie1"
                    placeholder="Favourite movie #1"
                >

                <input
                    type="text"
                    id="movie2"
                    placeholder="Favourite movie #2"
                >

                <input
                    type="text"
                    id="movie3"
                    placeholder="Favourite movie #3"
                >

            </div>


            <button
                id="recommendButton"
                onclick="getRecommendations()"
            >
                ✦ FIND MY MOVIES
            </button>

        </section>


        <!-- RESULTS -->

        <section
            id="results"
            class="results hidden"
        >

            <h2>
                Your AI Recommendations
            </h2>

            <div id="movieResults"></div>

        </section>


        <footer>
            MovieMind · AI Movie Recommendations
        </footer>

    </main>


<script>

async function getRecommendations() {

    const genre =
        document.getElementById("genre").value;

    const period =
        document.getElementById("period").value;

    const plotTwist =
        document.getElementById("plotTwist").value;

    const movies = [
        document.getElementById("movie1").value.trim(),
        document.getElementById("movie2").value.trim(),
        document.getElementById("movie3").value.trim()
    ].filter(movie => movie !== "");


    const results =
        document.getElementById("results");

    const movieResults =
        document.getElementById("movieResults");

    const button =
        document.getElementById("recommendButton");


    button.innerText =
        "🤖 FINDING YOUR MOVIES...";

    button.disabled = true;


    results.classList.remove("hidden");

    movieResults.innerHTML = `
        <div class="loading">
            <div class="loader"></div>
            <p>
                Our AI is searching for movies
                that match your taste...
            </p>
        </div>
    `;


    try {

        /*
        AI connection will be added next.
        */

        await new Promise(
            resolve => setTimeout(resolve, 1500)
        );


        movieResults.innerHTML = `
            <div class="demo-message">

                <h3>🎬 Your preferences are ready</h3>

                <p>
                    Genre: <strong>${genre}</strong>
                </p>

                <p>
                    Release period:
                    <strong>${period}</strong>
                </p>

                <p>
                    Plot twist:
                    <strong>${plotTwist}</strong>
                </p>

                <p>
                    Favourite movies:
                    <strong>
                        ${movies.length
                            ? movies.join(", ")
                            : "None provided"}
                    </strong>
                </p>

                <p>
                    🤖 The AI recommendation engine
                    will be connected next.
                </p>

            </div>
        `;

    } catch (error) {

        movieResults.innerHTML =
            "<p>Something went wrong.</p>";

    }


    button.innerText =
        "✦ FIND MY MOVIES";

    button.disabled = false;

}

</script>

</body>

</html>
